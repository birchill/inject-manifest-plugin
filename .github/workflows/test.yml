name: Automated checks
on: [push]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11

      - uses: actions/setup-node@v6
        with:
          cache: pnpm
          node-version: 24

      - name: Build
        run: |
          pnpm install
          pnpm build

      - name: Knip
        run: pnpm knip

      - name: Prettier
        run: pnpm prettier --check src "*.{ts,json,md}"
