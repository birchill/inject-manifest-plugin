name: Release
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version (optional)'
        required: false
        type: string
env:
  CI: true

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write

    steps:
      - uses: actions/checkout@v6

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: latest

      - uses: actions/setup-node@v6
        with:
          cache: pnpm
          node-version: 24
          registry-url: 'https://registry.npmjs.org'

      - name: Install
        run: pnpm install

      - name: Set Git username
        run: |-
          git config --global user.name "Release It"
          git config --global user.email "actions@users.noreply.github.com"

      # Temporary until setup-node action comes with npm version that contains
      # OIDC setup by default
      - name: update npm
        run: npm update -g npm

      - name: Publish default version
        if: ${{ inputs.version == '' }}
        run: pnpm release-it --ci
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish
        if: ${{ inputs.version }}
        run: pnpm release-it --ci -i ${{ inputs.version }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
